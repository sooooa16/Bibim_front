<!DOCTYPE html>

<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>당근마켓</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>

  <body onload="createNewTimeSpan()">
    <div class="top-bar">
      <div id="clock"></div>
      <!-- 상단 헤더 -->
      <header>
        <select>
          <option>군자동</option>
          <option>화양동</option>
          <option>구의1동</option>
          <option>자양1동</option>
          <option>능동</option>
          <option>구의2동</option>
        </select>

        <div class="icons">
          <ul>
            <li><img src ="img/Search.png" alt=""></li>
            <li><img src ="img/Menu.svg" alt=""></li>
            <li><img src ="img/Notification.png" alt=""></li>
          </ul>
        </div>
      </header>
    </div>
    <!-- 메인 콘텐츠 -->
    <section>
      <div class="item">
        <img src = "img/Rectangle 2.png" alt="에어팟">
        <div class="item-text">
          <h3>에어팟 프로</h3>
          <p class="meta">군자동ㆍ3일 전</p>
          <p class="price">220,000원</p>
        </div>
      </div>

      <div class="item">
        <img src = "img/Rectangle 2.png" alt="에어팟">
        <div class="item-text">
          <h3>바이레도 블랑쉬 50ml</h3>
          <p class="meta">광진구 구의제3동ㆍ26초 전</p>
          <p class="price">4,000원</p>
        </div>
      </div>

      <div class="item">
        <img src = "img/Rectangle 2.png" alt="에어팟">
        <div class="item-text">
          <h3>샌드위치</h3>
          <p class="meta">동대문구 휘경동ㆍ59초 전</p>
          <p class="price">8,000원</p>
        </div>
      </div>

      <div class="item">
        <img src = "img/Rectangle 2.png" alt="에어팟">
        <div class="item-text">
          <h3>아이폰 13프로맥스</h3>
          <p class="meta">군자동ㆍ1일 전</p>
          <p class="price">1,000,000원</p>
        </div>
      </div>

      <div class="item">
        <img src = "img/Rectangle 2.png" alt="에어팟">
        <div class="item-text">
          <h3>커피 머신</h3>
          <p class="meta">구리시 교문1동ㆍ1초 전</p>
          <p class="price">100,000원</p>
        </div>
      </div>

      <button class="fixed-button">+</button>

    </section>
    <!-- 하단 내비게이션 -->
    <nav>
      <ul>
        <li><a href="#!"><img src="img/Home_1.png" data-default="img/home.png" data-active="img/Home.png" alt="">홈</a></li>
        <li><a href="#!"><img src="img/News.png" data-default="img/News.png" data-active="img/News_1.png" alt="">동네생활</a></li>
        <li><a href="#!"><img src="img/Place Marker.png" alt="">내 근처</a></li>
        <li><a href="#!"><img src="img/Chat.png" data-default="img/Chat.png" data-active="img/Chat_1.png"alt="">채팅</a></li>
        <li><a href="#!"><img src="img/User.png" data-default="img/User.png" data-active="img/User_1.png" alt="">나의 당근</a></li>
      </ul>
    </nav>
    <script src="script.js"></script>
  </body>
</html>
