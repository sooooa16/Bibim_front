<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="jjystyle.css" />
    <title>당근마켓</title>
  </head>
  <body>
    <!-- 상단 헤더 -->
    <header>
      <button>군자동 <img src="imgs/Expand Arrow.png" /></button>
      <div class="top">
        <img src="imgs/Search.png" />
        <img src="imgs/Menu.svg" />
        <img src="imgs/Notification.png" />
      </div>
    </header>
    <!-- 메인 콘텐츠 -->
    <section>
      <!-- 상품 카드 -->
      <article>
        <img src="imgs/Rectangle 2.png" alt="에어팟 프로" />
        <div class="product">
          <h3>에어팟 프로</h3>
          <p>군자동 · 3일 전</p>
          <strong>220,000원</strong>
        </div>
      </article>
      <article>
        <img src="imgs/Rectangle 2.png" alt="바이레도 블랑쉬 50ml 향수" />
        <div class="product">
          <h3>바이레도 블랑쉬 50ml</h3>
          <p>광진구 구의제3동 · 26초 전</p>
          <strong>4,000원</strong>
        </div>
      </article>
      <article>
        <img src="imgs/Rectangle 2.png" alt="샌드위치" />
        <div class="product">
          <h3>샌드위치</h3>
          <p>동대문구 휘경동 · 59초 전</p>
          <strong>8,000원</strong>
        </div>
      </article>
      <article>
        <img src="imgs/Rectangle 2.png" alt="아이폰 13 프로 맥스" />
        <div class="product">
          <h3>아이폰 13프로맥스</h3>
          <p>군자동 · 1일 전</p>
          <strong>1,000,000원</strong>
        </div>
      </article>
      <article>
        <img src="imgs/Rectangle 2.png" alt="커피머신" />
        <div class="product">
          <h3>커피머신</h3>
          <p>구리시 교문1동 · 1초 전</p>
          <strong>100,000원</strong>
        </div>
      </article>
    </section>
    <!-- 하단 내비게이션 -->
    <nav>
      <ul>
        <li>
          <a href="#"><img src="imgs/Home.png" /><span>홈</span></a>
        </li>
        <li>
          <a href="#"><img src="imgs/News.png" />동네생활</a>
        </li>
        <li>
          <a href="#"
            ><img src="imgs/Place Marker.png" /><span>내 근처</span></a
          >
        </li>
        <li>
          <a href="#"><img src="imgs/Chat.png" /><span>채팅</span></a>
        </li>
        <li>
          <a href="#"><img src="imgs/User.png" /><span>나의 당근</span></a>
        </li>
      </ul>
    </nav>
  </body>
</html>
