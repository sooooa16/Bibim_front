<!DOCTYPE html>

  <div class="mobile-frame">
    <body>

      <header class="buton-header">

          <button> <img src="imgs/Notification.png" /> </button>
        </div>

      </header>

      <section class="product-list">

          <img src="imgs/Rectangle 2.png" alt="에어팟 프로" />

            <h3>에어팟 프로</h3>
            <p>군자동 · 3일 전</p>

          </div>

        <article class="product-card">

        <article class="product-card">
          <img src="imgs/sandwich.png" alt="샌드위치" />

            <h3>아이폰 13프로맥스</h3>
            <p>군자동 · 1일 전</p>

          </div>

        <article class="product-card">
          <img src="imgs/coffeeMachine.png" alt="커피머신" />

            <p>구리시 교문1동 · 1초 전</p>
            <strong>100,000원</strong>

      <nav class="bottom-nav">
        <ul>
          <li>
            <a href="#"><img src="imgs/Home.png" /><span>홈</span></a>

          </li>
          <li>

          </li>
          <li>
            <a href="#"><img src="imgs/User.png" /><span>나의 당근</span></a>
          </li>
        </ul>

        <nav class="floating-btn">
          <button><img src="imgs/Home Indicator.png"/></button>
        </nav>
