<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>당근마켓</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="location-selector">
      <select class="location-select-native">
        <option value="gunja" selected>군자동</option>
        <option value="hwayang">화양동</option>
        <option value="jayang">자양동</option>
        <option value="etc">내 동네 설정하기</option>
      </select>

    </div>
      <div class="header-icons">
        <span>🔍</span>
        <span>☰</span>
        <span>🔔</span>
      </div>
    </header>

    <main>
      <article class="item-card">
        <img src="airpods.png" class="item-image" alt="에어팟 프로" />
        <div class="item-text">
          <h2 class="item-title">에어팟 프로</h2>
          <p class="item-meta">군자동 · 3일 전</p>
          <strong class="item-price">220,000원</strong>
        </div>
        <div class="item-stats">
          <span> 3</span>
          <span>♡ 11</span>
        </div>
      </article>

      <article class="item-card">
        <img src="blanche.jpeg" class="item-image" alt="바이레도 블랑쉬" />
        <div class="item-text">
          <h2 class="item-title">바이레도 블랑쉬 50ml</h2>
          <p class="item-meta">광진구 구의제3동 · 26초 전</p>
          <strong class="item-price">4,000원</strong>
        </div>
        <div class="item-stats">
          <span>♡ 2</span>
        </div>
      </article>

      <article class="item-card">
        <img src="sandwich.jpeg" class="item-image" alt="샌드위치" />
        <div class="item-text">
          <h2 class="item-title">샌드위치</h2>
          <p class="item-meta">동대문구 휘경동 · 59초 전</p>
          <strong class="item-price">8,000원</strong>
        </div>
        <div class="item-stats"></div>
      </article>

      <article class="item-card">
        <img src="iphone.jpeg" class="item-image" alt="아이폰" />
        <div class="item-text">
          <h2 class="item-title">아이폰13 프로 맥스</h2>
          <p class="item-meta">군자동 · 1일 전</p>
          <strong class="item-price">1,000,000원</strong>
        </div>
        <div class="item-stats"></div>
      </article>

      <article class="item-card">
        <img src="coffeemachine.jpeg" class="item-image" alt="커피머신" />
        <div class="item-text">
          <h2 class="item-title">커피머신</h2>
          <p class="item-meta">구리시 교문1동 · 1초 전</p>
          <strong class="item-price">100,000원</strong>
        </div>
        <div class="item-stats"></div>
      </article>
    
      
    </main>

    <button class="fab">+</button>

    <nav>
      <div class="nav-item">
        <span class="nav-icon">🏠</span>
        <span>홈</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">📰</span>
        <span>동네생활</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">📍</span>
        <span>내 근처</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">💬</span>
        <span>채팅</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">👤</span>
        <span>나의 당근</span>
      </div>
    </nav>
  </body>
</html>
